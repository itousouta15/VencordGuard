name: Bug report
description: Report a reproducible VencordGuard problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include Discord tokens or private account data.
  - type: input
    id: version
    attributes:
      label: VencordGuard version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Discord channel
      options: [Stable, PTB, Canary]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
