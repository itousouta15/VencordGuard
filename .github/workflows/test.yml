name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build, dist | Out-Null
          go generate ./cmd/vencordguard
          go build -trimpath -ldflags="-H=windowsgui -s -w -X main.version=ci" -o build/VencordGuard.exe ./cmd/vencordguard
      - name: Validate installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc "/DMyAppVersion=0.1.0" installer/VencordGuard.iss
